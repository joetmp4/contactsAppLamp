<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/styles.css">
    <title>Login Failed</title>
</head>
<body>
    <main>
    <h1>Login failed</h1>
    <p id="login-error-message">We couldn't log you in. Please check your credentials and try again.</p>
    <a href="index.html">Back to login</a>
</main>
<script>
    const storedMessage = sessionStorage.getItem('loginErrorMessage');
    if (storedMessage) {
        document.querySelector('#login-error-message').textContent = storedMessage;
        sessionStorage.removeItem('loginErrorMessage');
    }
</script>
</body>
</html>
